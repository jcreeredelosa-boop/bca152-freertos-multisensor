[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
test_ignore = test_display, test_motion, test_temperature
check_skip_packages = yes
check_flags = --suppress=unusedFunction

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14
test_build_src = true
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<input.cpp> -<alarm.cpp> -<motion.cpp> -<rtos_objects.cpp>