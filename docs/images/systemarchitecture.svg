<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">System Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666">Layered decomposition — entry point, RTOS objects, tasks, and peripherals</text>

  <!-- Layer 1: main.cpp -->
  <rect x="270" y="90" width="360" height="70" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">main.cpp / app_main()</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#444">hardware init · RTOS object creation · task spawn</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="160" x2="450" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Layer 2: rtos_objects.cpp + logic.h -->
  <rect x="160" y="200" width="280" height="70" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="300" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">rtos_objects.cpp</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#444">queues · mutex · event group · safe_print</text>

  <rect x="460" y="200" width="280" height="70" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a148c">logic.h</text>
  <text x="600" y="250" text-anchor="middle" font-size="12" fill="#444">pure decision functions (unit-tested)</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="270" x2="450" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: 6 tasks in two rows of 3 -->
  <rect x="60"  y="320" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="180" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">SensorTask</text>
  <text x="180" y="365" text-anchor="middle" font-size="11" fill="#555">prio 2 · 2 s · vTaskDelayUntil</text>

  <rect x="330" y="320" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="450" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">DisplayTask</text>
  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#555">prio 1 · event-driven · owns OLED</text>

  <rect x="600" y="320" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="720" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">InputTask</text>
  <text x="720" y="365" text-anchor="middle" font-size="11" fill="#555">prio 3 · short periodic</text>

  <rect x="60"  y="400" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="180" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">MotionTask</text>
  <text x="180" y="445" text-anchor="middle" font-size="11" fill="#555">prio 3 · 50 ms · vTaskDelayUntil</text>

  <rect x="330" y="400" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="450" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">AlarmTask</text>
  <text x="450" y="445" text-anchor="middle" font-size="11" fill="#555">prio 2 · event-driven</text>

  <rect x="600" y="400" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="720" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">StateTask</text>
  <text x="720" y="445" text-anchor="middle" font-size="11" fill="#555">prio 2 · 500 ms · state machine</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="460" x2="450" y2="500" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: peripherals -->
  <rect x="60"  y="510" width="150" height="55" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="135" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">DHT22 + LDR</text>
  <text x="135" y="551" text-anchor="middle" font-size="10" fill="#555">GPIO 4 / 34</text>

  <rect x="225" y="510" width="150" height="55" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="300" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">SSD1306 OLED</text>
  <text x="300" y="551" text-anchor="middle" font-size="10" fill="#555">I2C · 21 / 22</text>

  <rect x="390" y="510" width="150" height="55" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="465" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">KY-040 Encoder</text>
  <text x="465" y="551" text-anchor="middle" font-size="10" fill="#555">GPIO 32 / 33 / 25</text>

  <rect x="555" y="510" width="140" height="55" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="625" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">Motion Input</text>
  <text x="625" y="551" text-anchor="middle" font-size="10" fill="#555">GPIO 27</text>

  <rect x="710" y="510" width="140" height="55" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="780" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">Buzzer</text>
  <text x="780" y="551" text-anchor="middle" font-size="10" fill="#555">GPIO 26</text>
</svg>